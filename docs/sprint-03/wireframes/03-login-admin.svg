<text x="1390" y="922" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111111" text-anchor="start">Responsif</text>
<text x="1390" y="946" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="start">390 px: kartu selebar layar.</text>
<text x="1390" y="965" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="start">Padding kartu 24 px minimum.</text>
